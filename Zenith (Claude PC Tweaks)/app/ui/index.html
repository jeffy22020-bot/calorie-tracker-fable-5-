<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenith</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.svg" alt="" width="36" height="36">
        <div>
          <div class="brand-name">ZENITH</div>
          <div class="brand-sub">Claude PC Tweaks</div>
        </div>
      </div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot">
        <a href="#settings" class="nav-item" data-route="settings"><span class="ico" data-icon="gear"></span><span>Settings</span></a>
        <div class="version" id="version"></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="titles">
          <h1 id="page-title">Dashboard</h1>
          <p id="page-sub"></p>
        </div>
        <div class="top-actions">
          <span class="chip" id="rp-chip" hidden></span>
          <button class="chip chip-warn" id="reboot-chip" data-action="reboot" hidden>Restart to finish</button>
          <button class="btn btn-restore" data-action="restore-all" title="Undo every change Zenith has made">
            <span class="ico" data-icon="restore"></span>Restore Original
          </button>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite">
        <div class="loading"><div class="spinner"></div><p>Scanning your PC...</p></div>
      </section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
